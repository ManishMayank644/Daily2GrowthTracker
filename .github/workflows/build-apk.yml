
name: Build Daily Growth Tracker APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - 'Daily2GrowthTracker-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Extract Android project
      - name: Extract Android project
        run: |
          unzip -o Daily2GrowthTracker-Android-Project.zip -d .
          echo "Checking Android project files..."
          ls -la Daily2GrowthTrackerAndroid
          ls -la Daily2GrowthTrackerAndroid/app

      # Step 3: Configure Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Step 4: Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Step 5: Verify SDK installation
      - name: Verify Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          sdkmanager --version

      # Step 6: Accept Android SDK licences
      - name: Accept SDK licences
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$sdk_status"

      # Step 7: Install required SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      # Step 8: Configure Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Step 9: Build APK
      - name: Build APK
        working-directory: Daily2GrowthTrackerAndroid
        run: |
          gradle --no-daemon assembleDebug

      # Step 10: Verify APK
      - name: Verify APK file
        run: |
          APK_PATH="Daily2GrowthTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$APK_PATH" ]; then
            echo "APK successfully generated!"
            ls -lh "$APK_PATH"
          else
            echo "ERROR: APK file not found!"
            exit 1
          fi

      # Step 11: Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily2GrowthTracker-APK
          path: Daily2GrowthTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
