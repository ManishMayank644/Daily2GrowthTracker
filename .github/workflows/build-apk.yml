
name: Build Daily Growth Tracker APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - 'Daily2GrowthTracker-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract Android project
      - name: Extract Android project
        run: |
          unzip -o Daily2GrowthTracker-Android-Project.zip -d .
          ls -la Daily2GrowthTrackerAndroid
          ls -la Daily2GrowthTrackerAndroid/app

      # 3. Set up Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Set up Android SDK and accept licences
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # 5. Verify SDK
      - name: Verify Android SDK
        run: |
          echo "Android SDK setup successful"
          sdkmanager --version

      # 6. Set up Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Build APK
      - name: Build APK
        working-directory: Daily2GrowthTrackerAndroid
        run: |
          gradle --no-daemon assembleDebug

      # 8. Verify APK
      - name: Verify APK
        run: |
          APK="Daily2GrowthTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK generation failed!"
            exit 1
          fi

          echo "APK generated successfully!"
          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily2GrowthTracker-APK
          path: Daily2GrowthTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
