
name: Build Daily Growth Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Daily2GrowthTracker-Android-Project.zip'
      - 'Daily2GrowthTrackerAndroid/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o Daily2GrowthTracker-Android-Project.zip -d .
          ls -la Daily2GrowthTrackerAndroid

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version


      - name: Accept SDK licences
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$sdk_status"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: Daily2GrowthTrackerAndroid
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily2GrowthTracker-APK
          path: Daily2GrowthTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
