
name: Build Daily Growth Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Daily2GrowthTracker-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip Daily2GrowthTracker-Android-Project.zip -d .
          ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd Daily2GrowthTrackerAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily2GrowthTracker-APK
          path: Daily2GrowthTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
